name: Weekly DB Backup

on:
  schedule:
    - cron: '0 3 * * 0' # Chủ nhật 3h UTC (~10h sáng giờ VN)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: supabase link --project-ref geqlgmtoigxrbyryprey

      - name: Dump data
        run: |
          mkdir -p backups
          supabase db dump --data-only -f "backups/$(date -u +%Y-%m-%d).sql"

      # Commit thẳng vào main bằng GITHUB_TOKEN có sẵn — không cần secret
      # mới. Chỉ commit khi có thay đổi thật (tránh commit rỗng nếu DB
      # không đổi từ tuần trước).
      - name: Commit backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet && echo "Không có gì thay đổi, bỏ qua commit" || git commit -m "chore: weekly DB backup $(date -u +%Y-%m-%d)"
          git push
